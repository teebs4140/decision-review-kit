# Example: a round-two tie-break, in a domain with no clinicians in it.
#
# The situation: a team is moving a public API off a legacy service. Round one asked
# eight questions; six came back agreed. This is the follow-up — only the places where
# the two deciders answered differently, plus one new question that round one's answers
# created, plus one correction where we told them something untrue.
#
# Three things worth copying from this file:
#
#   * `positions` quotes both people verbatim, side by side, in equal space. Seeing the
#     other view is what lets someone concede in one line instead of restating their own.
#   * `skip_if` says when a question is moot, so nobody answers a card that their own
#     answer to an earlier card already resolved.
#   * MIGR2-04 opens by saying the previous round's card was wrong. That reads as risky
#     and is not: quietly working around a false premise is what loses trust.
#
#   python scripts/build_form.py examples/migration-review.yaml -o migration-review.html

title: "Payments API cutover — four things you answered differently"
form_id: payments-cutover-r2
round: 2
storage_key: payments-cutover-r2
kicker: "Cutover review · round 2 · 4 decisions"
minutes: 12

# Round one used MIGR-. Round two must not reuse it, or answers to the two rounds
# cannot be told apart in the returned files. ADR- is the architecture decision record
# the project already keeps; DEP- is the deprecation tracker.
id_prefix: "MIGR2-"
reserved_prefixes: ["ADR-", "DEP-", "MIGR-"]

intro: >
  Short one. Six of the eight questions from last round came back with both of you
  saying the same thing, and those are settled and folded away at the bottom. What is
  left is the three you answered differently, plus one that your answers created — and
  one correction, because <b>the traffic figure I gave you for MIGR-06 was wrong</b>
  and the decision may look different with the right number. Each card quotes you both
  as you wrote it. If you are happy to go with the other view, say so and I will close it.

footer: >
  Generated by decision-review-kit. Request counts are from the 30-day window ending
  12 March and exclude internal health checks. Quotes are verbatim from the round-one
  returns except where labelled otherwise.

sections:
  - title: "1 · Where you landed differently"
    note: >
      Pick an option or write your own. "Go with theirs" is a complete answer and the
      fastest way to close one of these.
    items:

      - id: MIGR2-01
        origin: ADR-207
        type: tie-break
        title: "How long the legacy endpoints stay up"
        question: >
          After the new endpoints go live, how long do the old ones keep answering —
          90 days, 12 months, or until measured traffic falls below a threshold?
        positions:
          Priya: >
            chose <i>90 days</i> — “Every month we keep both up is a month of
            double-writing and a month where a bug can only be reproduced on one of
            them. Ninety days is generous for an internal integration and the external
            ones are on contracts we can point at.”
          Marcus: >
            chose <i>12 months</i> — “Two of the four external consumers are on annual
            release trains. A 90-day window means they physically cannot land the change,
            so what actually happens is we grant exceptions one at a time and end up
            running both for 12 months anyway, but without having planned for it.”
        recommendation: >
          Go with the traffic threshold, floored at 90 days and capped at 12 months. It
          gives Marcus the thing he actually needs — the annual-train consumers cannot be
          stranded — without committing to a year for the six consumers who will have
          migrated inside a month. The cap is what stops it becoming indefinite, which is
          the failure mode Priya is pointing at, and the floor stops a quiet consumer
          being cut off in week three.
        options:
          - "90 days, hard stop"
          - "12 months, hard stop"
          - "Traffic threshold, floor 90 days, cap 12 months"
        background: >
          Ten consumers today. Six are internal and deploy weekly. Four are external:
          two on annual release trains (<b>Northwind</b>, <b>Calder</b>), two continuous.
          The double-write path is the expensive part of keeping both alive — it is the
          only place in the system where a write can half-succeed.
        cost: >
          Every extra month of dual running is roughly <b>two engineer-days</b> of
          maintenance and keeps the double-write path — the source of 3 of the last 5
          data-integrity incidents — in production.
        table:
          columns: ["consumer", "type", "release cadence", "migrated by day 90?"]
          rows:
            - ["6 internal services", "internal", "weekly", "yes, comfortably"]
            - ["Ardent", "external", "continuous", "yes"]
            - ["Halloway", "external", "continuous", "yes"]
            - ["Northwind", "external", "annual, next window in November", "no"]
            - ["Calder", "external", "annual, next window in February", "no"]

      - id: MIGR2-02
        origin: ADR-211
        type: tie-break
        title: "Whether the old response shape is preserved"
        question: >
          Does the new endpoint return the legacy response shape for existing consumers,
          or does everyone move to the new shape at cutover?
        positions:
          Priya: >
            chose <i>new shape for everyone</i> — “A compatibility shim is a permanent
            feature that we will describe as temporary for three years. I would rather
            take the pain once, with everyone, on a date we choose.”
          Marcus: >
            chose <i>preserve the old shape behind a header</i> — “The shape change and
            the service move are two migrations. Doing both at once means that when
            something breaks in November we cannot tell which one broke it.”
        skip_if: >
          If you chose the 12-month window in MIGR2-01, this one largely answers itself —
          a year of dual running with two shapes is the thing we are trying not to build.
          Say so and skip it.
        recommendation: >
          Preserve the old shape, but behind an explicit opt-in header with the removal
          date in the response. Marcus's separation-of-migrations point is the stronger
          one: a cutover that changes two things at once is a cutover you cannot debug.
          The header is what stops it becoming permanent, because it makes every legacy
          consumer visible in the logs rather than merely inferable.
        options:
          - "New shape for everyone at cutover"
          - "Preserve old shape behind an opt-in header, with a removal date"
          - "Preserve old shape by default, new shape opt-in"
        cost: >
          The shim is about <b>400 lines</b> and one integration test matrix. Option 3
          is cheapest to build and the hardest to ever remove, because nothing forces a
          consumer to declare that they are still on the old shape.

      - id: MIGR2-03
        origin: ADR-214
        type: tie-break
        title: "What happens to in-flight idempotency keys"
        question: >
          At cutover, do idempotency keys issued by the legacy service remain honoured by
          the new one, or does the key space start clean?
        positions:
          Priya: >
            chose <i>start clean</i> — “The legacy key store has no TTL and 40 million
            rows of unknown provenance. I do not want to import that.”
          Marcus: >
            chose <i>honour them</i> — “A retry that crosses the cutover with a clean key
            space is a double charge. That is the one failure here that ends up in the
            press.”
        recommendation: >
          Honour them, but only for keys seen in the 48 hours before cutover — about
          <b>190,000</b> rows rather than 40 million. That covers every realistic retry
          window and leaves the 40-million-row store where it is. Marcus is right about
          the consequence and Priya is right about the store; the overlap window is what
          separates the two concerns.
        options:
          - "Start clean"
          - "Import the full legacy key space"
          - "Import a 48-hour overlap window"
        background: >
          The longest observed client retry interval in the last 90 days is
          <b>6 hours 20 minutes</b>, from one batch consumer. The legacy store holds keys
          back to 2019 because nobody ever wrote the expiry job.
        cost: >
          The 48-hour import is ~190,000 rows and runs in under a minute. The full import
          is 40M rows, needs its own migration window, and imports a data-quality problem
          we have so far avoided owning.

  - title: "2 · One correction, and one new question"
    note: >
      The first of these is my error from last round. The second only exists because of
      how you answered MIGR-06.
    items:

      - id: MIGR2-04
        origin: ADR-206
        type: correction
        title: "Correction — the traffic figure behind MIGR-06 was wrong"
        question: >
          Given the real numbers, does your answer to MIGR-06 still stand — do we keep
          the batch endpoint at all?
        recommendation: >
          I think it still stands, but for a different reason than the one I gave you.
          Not "almost nobody uses it" — the right framing is "one consumer uses it heavily
          and has a supported alternative", which is a conversation with Calder rather
          than a deprecation.
        options:
          - "Deprecate the batch endpoint as decided"
          - "Keep it — one heavy consumer is enough"
          - "Keep it, but talk to Calder about moving before we decide"
        background: >
          Last round I told you the batch endpoint served <b>0.3%</b> of requests and
          implied it was near-unused. That was requests, not payload: it is 0.3% of calls
          and <b>31%</b> of rows written, because each call carries up to 5,000 records.
          One consumer (Calder) accounts for 94% of it. The error was mine — I pulled a
          request count when the meaningful unit was rows.
        cost: >
          Deprecating it moves 31% of written volume onto the per-record endpoint, which
          at current batch sizes is about <b>340 additional requests per second</b> at
          peak. That is inside capacity but it is not nothing, and it was not in the
          picture when you answered.

      - id: MIGR2-05
        origin: DEP-118
        type: scope
        title: "New — who is told, and when"
        question: >
          Do external consumers get told at cutover, at the start of the deprecation
          window, or when their own traffic crosses the threshold?
        skip_if: >
          Only relevant if you picked the traffic-threshold option in MIGR2-01. A hard
          date makes this a calendar exercise rather than a decision.
        recommendation: >
          Tell everyone at the start of the window, then again when their own traffic
          crosses the threshold. A single announcement at the start is read by whoever
          happens to be on rotation that week; the second message is the one that lands,
          because it is about them.
        options:
          - "One announcement at the start of the window"
          - "At the start, and again per-consumer at threshold"
          - "Per-consumer only, at threshold"
        cost: >
          Option 2 is one templated email plus an automated per-consumer trigger — about
          a day of work. Option 3 is cheaper and means a consumer's first notice arrives
          when they are already most of the way to being cut off.

  - title: "3 · Settled last round"
    kind: settled
    summary: "6 decisions from round 1 — open only if you want to check nothing was recorded wrongly"
    note: >
      Recorded as agreed because you both chose the same option. If any of these looks
      wrong, say so now rather than at cutover.
    items:
      - id: MIGR-01
        title: "The new service owns writes; the legacy service becomes read-only at cutover"
        background: "Both chose the read-only option. Priya: “no split-brain, ever.”"
        effect: "Legacy write paths return 405 from cutover. The double-write path exists only during the dual-run window."
      - id: MIGR-02
        title: "Cutover is a single flip, not a percentage ramp"
        background: >
          Both chose the flip. A percentage ramp was ruled out because idempotency keys
          would be split across two stores for the duration.
        effect: "One maintenance window, 20 minutes, with a documented rollback to read-only legacy."
      - id: MIGR-03
        title: "Authentication does not change in this migration"
        background: "Agreed to keep the existing token issuer and move it separately."
        effect: "No consumer needs to re-issue credentials at cutover."
      - id: MIGR-04
        title: "Rate limits carry over unchanged"
        background: "Both chose unchanged, to keep the number of moving parts down."
        effect: "Existing per-consumer limits are copied as-is; any revision is a separate change."
      - id: MIGR-05
        title: "Error codes are preserved verbatim"
        background: >
          Marcus: “consumers branch on these strings and we will never find all the
          places they do it.” Priya agreed.
        effect: "The new service emits the legacy error taxonomy, including the two codes documented as deprecated."
      - id: MIGR-07
        title: "The migration is reversible for 14 days"
        background: "Agreed. Reversibility ends when the legacy read path is retired."
        effect: "Legacy tables are retained and kept in sync for 14 days after cutover; drop is a separate scheduled change."

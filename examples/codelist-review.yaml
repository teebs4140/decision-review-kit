# Example: getting a code list signed off by asking about CONCEPTS, not codes.
#
# The situation this is built for: a team maintains a code list. A clinical owner
# reviews it, says "this is wrong", and nobody can act on that — because "wrong"
# is a judgement about inclusion boundaries, and the artifact under review is four
# thousand numeric codes. So the list gets defended rather than owned, and the team
# takes a permanently defensive posture against every possible future complaint.
#
# The move: surface the six or eight decisions the list actually rests on. The owner
# answers those. The list follows from the answers, mechanically. Now the owner
# defines what acceptable means and owns the result, and the team stops guessing.
#
# Note what is NOT here: no code is shown for approval. Every question is about a
# boundary a clinician has an opinion on, with the count attached so the opinion is
# informed. That is the whole trick.
#
#   python scripts/build_form.py examples/codelist-review.yaml -o codelist-review.html

title: "Diabetes code list — eight decisions before we build it"
form_id: dm-codelist-r1
round: 1
storage_key: dm-codelist-r1
kicker: "Code list review · round 1 · 8 decisions"
minutes: 20

# The form's own namespace. Our tracker already uses CL-nnn for code-list tickets,
# so the form uses CLQ- and each item carries `origin` pointing back. Without this
# the returned answers cannot be reliably matched to anything.
id_prefix: "CLQ-"
reserved_prefixes: ["CL-", "TKT-"]

intro: >
  We can build this list once you have made eight calls. <b>You are not being asked to
  approve four thousand codes</b> — you are being asked where the boundaries sit. Each
  question below is a boundary, with the number of patients it moves, so you can see
  what your answer costs before you give it. Once these are settled the list follows
  mechanically, and we will send back the resulting list with each code labelled by
  which of your decisions admitted it.

footer: >
  Generated by decision-review-kit. Counts are from the 2024 extract and are
  approximate to two significant figures. Nothing here is a commitment to a final
  list — it is the set of judgements the list will be built from.

sections:
  - title: "1 · Where the boundaries sit"
    note: "Pick an option or write your own. Every one of these changes who ends up in the cohort."
    items:

      - id: CLQ-01
        origin: CL-102
        type: boundary
        title: "Gestational diabetes"
        question: "Does a patient whose only diabetes coding is gestational count as having diabetes?"
        recommendation: >
          Exclude from the main list, but ship it as a named sub-list so a study that wants
          it can switch it on without rebuilding. Gestational diabetes resolves after
          delivery in most patients, so including it silently changes what the cohort means.
        options:
          - "Exclude — gestational is a different condition"
          - "Include — any diabetes coding counts"
          - "Exclude from the main list, ship as a switchable sub-list"
        background: >
          There are <b>1,240 patients</b> whose <i>only</i> diabetes code is gestational
          (O24.4 and descendants). A further 310 have gestational coding <i>and</i> a later
          type-2 code — those are unaffected by this decision either way, since the type-2
          code admits them.
        cost: >
          Excluding moves 1,240 patients (<b>3.1%</b> of the candidate cohort) out.
          Including them raises the median age of the female cohort by about 4 years,
          because they cluster at childbearing age.

      - id: CLQ-02
        origin: CL-104
        type: boundary
        title: "Pre-diabetes and impaired glucose tolerance"
        question: "Do R73.03 (pre-diabetes) and impaired glucose tolerance belong in the list?"
        recommendation: >
          Exclude. Pre-diabetes is a risk state rather than the disease, and its coding is
          heavily site-dependent — three sites use it routinely, eleven never do, so
          including it makes the cohort's site mix an artefact of documentation habit.
        options:
          - "Exclude both"
          - "Include both"
          - "Include pre-diabetes only"
        cost: >
          <b>4,820 patients</b> carry pre-diabetes coding and no other diabetes code —
          <b>12%</b> of the candidate cohort, and they are not evenly spread: they are
          38% of one site's contribution and under 2% at eleven others.

      - id: CLQ-03
        origin: CL-107
        type: boundary
        title: "Drug-only evidence"
        question: "Does a metformin prescription with no diabetes diagnosis code count?"
        recommendation: >
          Do not admit drug-only patients to the main list. Metformin is prescribed for
          PCOS and for weight management, so a drug-only rule imports patients who do not
          have the condition — and it does so unevenly, because prescribing habits differ.
        options:
          - "Diagnosis code required — drugs never admit on their own"
          - "A diabetes-specific drug admits (insulin, sulfonylureas — not metformin)"
          - "Any diabetes drug admits, including metformin"
        background: >
          <b>2,100 patients</b> have a diabetes drug and no diagnosis code. Of those,
          1,460 are metformin-only. The remaining 640 are on insulin or a sulfonylurea,
          which are far more specific to diabetes.
        cost: >
          Option 2 adds 640 patients and is the defensible middle. Option 3 adds 2,100 and
          brings in a PCOS population we cannot separate afterwards.

      - id: CLQ-04
        origin: CL-111
        type: boundary
        title: "Secondary and drug-induced diabetes"
        question: "Do steroid-induced and post-transplant diabetes count as diabetes here?"
        recommendation: >
          Include, flagged. They are genuinely diabetes by every clinical definition, but a
          study of type-2 natural history would want them out — so the honest move is to
          include and label rather than to decide their fate silently on their behalf.
        options:
          - "Include, flagged as secondary"
          - "Include, unflagged"
          - "Exclude"
        cost: "About <b>380 patients</b>, under 1%. Low stakes numerically; high stakes for interpretation."

      - id: CLQ-05
        origin: CL-118
        type: boundary
        title: "How many codes make a case"
        question: "Is one diagnosis code enough, or do you want two on separate days?"
        recommendation: >
          Two codes on separate days for the primary definition, with the one-code version
          reported beside it. One code is well known to admit rule-out coding — a code
          recorded while the question was being asked rather than after it was answered.
        options:
          - "One code is enough"
          - "Two codes on separate days"
          - "Two codes, or one code plus a confirmatory lab"
        cost: >
          Requiring two codes removes <b>3,900 patients</b> (<b>9.8%</b>). Of those, 71%
          have exactly one code and no diabetes drug and no HbA1c above threshold — which
          is what rule-out coding looks like.

      - id: CLQ-06
        origin: CL-121
        type: boundary
        title: "Laboratory evidence"
        question: "Does an HbA1c at or above 6.5% admit a patient with no diagnosis code?"
        recommendation: >
          Yes for a single confirmed value at or above 6.5%. Labs are the least
          documentation-dependent signal available and they close a real gap at the two
          sites whose diagnosis coding is sparsest.
        options:
          - "Yes — one value at or above 6.5% admits"
          - "Yes, but two values are needed"
          - "No — labs support a case but never create one"
        background: >
          <b>1,730 patients</b> have at least one HbA1c ≥ 6.5% and no diabetes diagnosis
          code. 1,190 of them have two or more such values.
        cost: >
          Option 1 adds 1,730; option 2 adds 1,190. Note the interaction with CLQ-05: if
          you require two diagnosis codes there, labs become the main route by which
          genuinely diabetic but lightly-coded patients get in.

      - id: CLQ-07
        origin: CL-125
        type: boundary
        title: "Type 1 and type 2 together or apart"
        question: "Should the list be one list, or two that can be combined?"
        recommendation: >
          Build two and let studies union them. Separating later is impossible where a
          patient carries both codings; separating now is a labelling job.
        options:
          - "Two lists, unioned when needed"
          - "One combined list"
          - "Two lists plus a third for patients coded both ways"
        background: >
          <b>890 patients</b> carry both type-1 and type-2 codes at different times, which
          is usually reclassification rather than two diseases.

      - id: CLQ-08
        origin: CL-131
        type: boundary
        title: "How wide to go down the hierarchy"
        question: >
          Should we take every descendant of the diabetes concepts, or stop at the
          clinically-reviewed set?
        recommendation: >
          Take all descendants, then send you the ones that actually occur in the data for
          a look. The full expansion is 3,412 concepts, but only <b>287</b> of them appear
          here at all — reviewing 287 is a morning, reviewing 3,412 is not going to happen.
        options:
          - "All descendants, review only those that occur in the data"
          - "All descendants, no review"
          - "Only the concepts on the reviewed seed list"
        cost: >
          The reviewed-seed-only option misses <b>140 concepts</b> that occur here,
          covering 2,600 patients — mostly complication codes such as diabetic nephropathy
          that imply the diagnosis without stating it.

  - title: "2 · Already settled"
    kind: settled
    summary: "3 items settled earlier — open only if you want to check nothing was recorded wrongly"
    note: >
      Listed so nobody answers the same thing twice, and so you can see what is already
      fixed before you answer the eight above.
    items:
      - id: CL-101
        title: "The vocabulary is SNOMED, with ICD-10 mapped in"
        background: "Agreed at the September meeting; matches the network standard."
        effect: "No change. ICD-10-only records reach the list through the standard mapping."
      - id: CL-103
        title: "The extract window is 2015 onward"
        background: "Coding practice before 2015 differs enough that earlier records were judged unusable."
        effect: "No change."
      - id: CL-109
        title: "Neonatal diabetes is out of scope"
        background: "A different disease with a different genetic basis; out by agreement."
        effect: "Excluded regardless of how the questions above are answered."
